name: LeRobot CPU

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-lerobot.txt numpy==1.26.4 scipy==1.15.3 zarr==2.18.3 numcodecs==0.13.1 imagecodecs==2025.3.30 hydra-core==1.2.0 'omegaconf>=2.3' diffusers==0.11.1 huggingface-hub==0.25.2 pytest==9.0.2 ruff==0.15.0
      - name: Lint and format
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Synthetic LeRobot and training-interface tests
        run: python -m pytest tests/test_lerobot.py -q
